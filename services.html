<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Services — OPEN GRAIN</title>
<meta name="description" content="Photography, film, UGC, events and social content services from OPEN GRAIN in Mallorca.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="assets/ux/og-ux-fixes.css">
</head>
<body class="is-services">

<!-- The whole page sits on the soft gradient, breathing slowly, rather than
     the gradient being one band inside a dark page. -->
<div class="pulse-bg" aria-hidden="true"></div>

<main class="site-shell light-page" id="site-shell">

  <a class="wordmark" href="/">OPEN GRAIN<span>®</span></a>
  <!-- Barra de navegación inferior. Enlaces reales de respaldo: si
       og-tabbar.js no llega a ejecutarse, la web se sigue pudiendo navegar.
       El componente los sustituye por iconos al montarse. -->
  <nav class="dock" id="dock" aria-label="Primary">
    <a href="/">Home</a>
    <a href="/work">Work</a>
    <a href="/services">Services</a>
    <a href="/about">Studio</a>
    <a href="/contact">Contact</a>
  </nav>

  <header class="svc-hero">
    <p class="svc-kicker"><span>02</span><span id="services-label"></span></p>
    <h1 id="services-heading"></h1>
    <p class="svc-lede" id="statement-body"></p>
  </header>

  <div class="marquee" id="service-marquee"></div>
  <!-- El carrusel se mueve solo y sin fin: este botón permite pararlo en
       móvil y con teclado, donde no existe el «pasar el ratón por encima». -->
  <div class="marquee-controls">
    <button type="button" class="marquee-toggle" id="marquee-toggle" aria-controls="service-marquee">
      <svg class="icon-pause" width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      <svg class="icon-play" width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
      <span id="marquee-toggle-text">Pause</span>
    </button>
  </div>

  <section class="svc-index" aria-label="Services">
    <ol id="service-cards"></ol>
  </section>

  <footer class="light-footer">
    <div class="footer-brand">OPEN GRAIN</div>
    <div>
      <a href="https://instagram.com/opengrain.studio" target="_blank" rel="noopener">Instagram</a>
      <a href="https://tiktok.com/@opengrain.studio" target="_blank" rel="noopener">TikTok</a>
      <a href="mailto:adamabalde1998@gmail.com">Email</a>
    </div>
    <p id="footer-based"></p>
    <span>© <span id="year"></span> OPEN GRAIN · <a href="/aviso-legal" lang="es">Aviso legal</a> · <a href="/privacidad" lang="es">Privacidad</a> · <a href="/cookies" lang="es">Cookies</a></span>
  </footer>

</main>

<script defer src="main.js"></script>
<script defer src="assets/motion.js"></script>
</body>
</html>
