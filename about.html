<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Studio — OPEN GRAIN</title>
<meta name="description" content="About OPEN GRAIN, an independent creative production studio based in Mallorca.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="assets/ux/og-ux-fixes.css">
</head>
<body class="is-light">

<div class="pulse-bg" aria-hidden="true"></div>

<main class="site-shell light-page" id="site-shell">

  <a class="wordmark" href="index.html">OPEN GRAIN<span>®</span></a>
  <!-- Enlaces reales de respaldo: si og-notch.js no llega a ejecutarse, la web
       se sigue pudiendo navegar. El componente los sustituye al montarse. -->
  <nav class="dock" id="dock" aria-label="Primary">
    <a href="index.html">Home</a>
    <a href="work.html">Work</a>
    <a href="services.html">Services</a>
    <a href="about.html">Studio</a>
    <a href="contact.html">Contact</a>
  </nav>

  <header class="svc-hero">
    <p class="svc-kicker"><span>03</span><span id="studio-label"></span></p>
    <h1 id="studio-heading"></h1>
    <p class="svc-lede" id="studio-body"></p>
    <p class="studio-mark-light">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      <span id="studio-tag">Visuals with something to say.</span>
    </p>
  </header>

  <!-- Social: pick a network, see the selected posts for it. Up to 12, laid
       out 4 columns on desktop and 3 on a phone, each thumbnail keeping its
       own proportions. Tapping one opens the expanded view. -->
  <section class="social-stage" id="social" aria-labelledby="social-title">
    <div class="social-head-light">
      <h2 id="social-title"><em id="social-title-a"></em> <span id="social-title-b"></span></h2>
      <p id="social-lede"></p>
    </div>

    <div class="net-tabs" id="net-tabs" role="tablist" aria-label="Redes sociales"></div>

    <div class="social-mosaic" id="social-grid"></div>

    <p class="social-empty" id="social-empty" hidden></p>
  </section>

  <footer class="light-footer">
    <div class="footer-brand">OPEN GRAIN</div>
    <div>
      <a href="https://instagram.com/opengrain.studio" target="_blank" rel="noopener">Instagram</a>
      <a href="https://tiktok.com/@opengrain.studio" target="_blank" rel="noopener">TikTok</a>
      <a href="mailto:adamabalde1998@gmail.com">Email</a>
    </div>
    <p id="footer-based"></p>
    <span>© <span id="year"></span> OPEN GRAIN · <a href="aviso-legal.html">Aviso legal</a> · <a href="privacidad.html">Privacidad</a> · <a href="cookies.html">Cookies</a></span>
  </footer>

</main>

<!-- Expanded post view. Placeholder styling for now: Adama is sending the
     design for this screen. -->
<div id="post-sheet" class="post-sheet" hidden role="dialog" aria-modal="true" aria-label="Publicación ampliada">
  <button type="button" class="post-sheet-close" id="post-sheet-close" aria-label="Cerrar">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </button>
  <figure class="post-sheet-box">
    <img id="post-sheet-img" src="" alt="">
    <figcaption>
      <span class="post-sheet-net" id="post-sheet-net"></span>
      <h3 id="post-sheet-caption"></h3>
      <a class="post-sheet-link" id="post-sheet-link" href="#" target="_blank" rel="noopener"></a>
    </figcaption>
  </figure>
</div>

<div id="lightbox" class="lightbox" hidden role="dialog" aria-modal="true" aria-label="Vista ampliada del proyecto">
  <figure class="lightbox-figure">
    <button type="button" class="lightbox-close" id="lightbox-close" aria-label="Cerrar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <img id="lightbox-img" src="" alt="">
    <figcaption>
      <span id="lightbox-eyebrow"></span>
      <h3 id="lightbox-title"></h3>
    </figcaption>
  </figure>
</div>

<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script defer src="assets/config.js"></script>
<script defer src="assets/default-copy.js"></script>
<script defer src="assets/ux/og-notch.js"></script>
<script defer src="assets/ux/og-contact.js"></script>
<script defer src="main.js"></script>
<script defer src="assets/motion.js"></script>
</body>
</html>
