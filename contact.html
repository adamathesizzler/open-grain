<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Open Grain</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-primary: #a855f7;
            --color-secondary: #ec4899;
            --color-accent: #06b6d4;
            --bg-dark: #0f172a;
            --bg-darker: #020617;
            --text-light: #e2e8f0;
            --text-muted: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #1e293b 50%, var(--bg-darker) 100%);
            color: var(--text-light);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Background animated gradient */
        .bg-animated {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .bg-animated::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(
                circle at 20% 50%,
                rgba(168, 85, 247, 0.1) 0%,
                transparent 50%
            );
            animation: gradientShift 8s ease-in-out infinite;
        }

        .bg-animated::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(
                circle at 80% 80%,
                rgba(34, 211, 238, 0.1) 0%,
                transparent 50%
            );
            animation: gradientShift 8s ease-in-out infinite reverse;
        }

        @keyframes gradientShift {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.7;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .bg-animated::before,
            .bg-animated::after {
                animation: none;
            }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 60px;
        }

        .header h1 {
            font-size: clamp(2.5rem, 8vw, 4rem);
            font-weight: 800;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #a78bfa 0%, #ec4899 50%, #22d3ee 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            font-size: 1.25rem;
            color: var(--text-muted);
        }

        /* Main content grid */
        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            max-width: 1200px;
            width: 100%;
            align-items: center;
        }

        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
                gap: 40px;
            }
        }

        /* Services list */
        .services-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .service-card {
            padding: 24px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .service-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateX(-8px);
        }

        .service-card.active {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 20px 40px rgba(168, 85, 247, 0.2);
        }

        .service-emoji {
            font-size: 2.5rem;
            min-width: 60px;
        }

        .service-info h3 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .service-info p {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        /* Right side - Card display */
        .card-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 40px;
        }

        /* Service card display */
        .service-display {
            width: 240px;
            height: 240px;
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .service-display.film {
            background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
        }

        .service-display.photos {
            background: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%);
        }

        .service-display.drone {
            background: linear-gradient(135deg, #f97316 0%, #dc2626 100%);
        }

        .service-display.events {
            background: linear-gradient(135deg, #10b981 0%, #06d6a0 100%);
        }

        /* Shine effect */
        .shine {
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.2),
                transparent
            );
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% {
                left: -100%;
            }
            50% {
                left: 100%;
            }
            100% {
                left: 100%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .shine {
                animation: none;
            }
        }

        /* Message section */
        .message-section {
            text-align: center;
            animation: fadeInUp 0.6s ease 0.3s both;
        }

        .message-section h2 {
            font-size: clamp(1.8rem, 5vw, 2.8rem);
            font-weight: 700;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #c4b5fd 0%, #f472b6 50%, #67e8f9 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .message-section p {
            font-size: 1rem;
            color: var(--text-muted);
            max-width: 400px;
            margin: 0 auto 30px;
        }

        /* CTA Button */
        .cta-button {
            position: relative;
            padding: 16px 32px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
            cursor: pointer;
            transition: all 0.3s ease;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(168, 85, 247, 0.3);
        }

        .cta-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            transition: left 0.3s ease;
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(168, 85, 247, 0.4);
        }

        .cta-button:hover::before {
            left: 100%;
        }

        .cta-button:active {
            transform: translateY(0);
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .header h1 {
            animation: fadeInUp 0.6s ease both;
        }

        .header p {
            animation: fadeInUp 0.6s ease 0.1s both;
        }

        .services-list {
            animation: fadeInUp 0.6s ease 0.2s both;
        }

        .card-container {
            animation: fadeInUp 0.6s ease 0.3s both;
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
                transition: none !important;
            }

            .service-card:hover {
                transform: none;
            }
        }

        /* Bottom note */
        .bottom-note {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.9rem;
            color: var(--text-muted);
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="bg-animated"></div>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>Cuéntanos</h1>
            <p>¿Qué quieres crear?</p>
        </div>

        <!-- Main Content -->
        <div class="content">
            <!-- Left: Services list -->
            <div class="services-list" id="servicesList"></div>

            <!-- Right: Card display + message -->
            <div class="card-container">
                <div class="service-display" id="serviceDisplay">
                    <div class="shine"></div>
                </div>

                <div class="message-section">
                    <h2 id="serviceName">Film & Reels</h2>
                    <p id="serviceDescription">Vídeo profesional para tu marca</p>
                    <button class="cta-button" onclick="openWizard()">
                        Solicitar Presupuesto
                    </button>
                </div>
            </div>
        </div>

        <div class="bottom-note">
            Selecciona lo que necesitas y cuéntanos más detalles →
        </div>
    </div>

    <script>
        // Service data
        const services = [
            {
                id: 'film',
                title: 'Film & Reels',
                description: 'Vídeo profesional para tu marca',
                emoji: '🎬',
                color: 'film'
            },
            {
                id: 'photos',
                title: 'Fotografía Profesional',
                description: 'Captura cada momento perfecto',
                emoji: '📸',
                color: 'photos'
            },
            {
                id: 'drone',
                title: 'Drone & Aéreo',
                description: 'Perspectiva única y cinéfila',
                emoji: '🚁',
                color: 'drone'
            },
            {
                id: 'events',
                title: 'Eventos Especiales',
                description: 'Bodas, corporativos y más',
                emoji: '✨',
                color: 'events'
            }
        ];

        let currentService = 'film';

        // Initialize
        function init() {
            renderServices();
            selectService('film');
        }

        // Render services list
        function renderServices() {
            const list = document.getElementById('servicesList');
            list.innerHTML = services.map(service => `
                <div class="service-card ${service.id === currentService ? 'active' : ''}"
                     onclick="selectService('${service.id}')">
                    <div class="service-emoji">${service.emoji}</div>
                    <div class="service-info">
                        <h3>${service.title}</h3>
                        <p>${service.description}</p>
                    </div>
                </div>
            `).join('');
        }

        // Select service with animation
        function selectService(serviceId) {
            currentService = serviceId;
            const service = services.find(s => s.id === serviceId);

            // Update cards
            document.querySelectorAll('.service-card').forEach(card => {
                card.classList.remove('active');
            });
            document.querySelector(`[onclick="selectService('${serviceId}')"]`).classList.add('active');

            // Animate card rotation
            const display = document.getElementById('serviceDisplay');
            display.className = `service-display ${service.color}`;
            display.innerHTML = `
                <div style="font-size: 5rem;">${service.emoji}</div>
                <div class="shine"></div>
            `;

            // Animate text
            document.getElementById('serviceName').textContent = service.title;
            document.getElementById('serviceDescription').textContent = service.description;

            // Spring animation
            animateRotation(display);
        }

        // Simple rotation animation
        function animateRotation(element) {
            element.style.transform = 'rotateY(20deg) scale(0.9)';
            element.style.opacity = '0.7';

            setTimeout(() => {
                element.style.transition = 'all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';
                element.style.transform = 'rotateY(0deg) scale(1)';
                element.style.opacity = '1';
            }, 50);
        }

        // Open wizard (placeholder)
        function openWizard() {
            alert(`Has seleccionado: ${services.find(s => s.id === currentService).title}\n\nAhora puedes integrar tu wizard aquí.`);
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
