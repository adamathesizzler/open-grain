<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — OPEN GRAIN</title>
<meta name="description" content="Plan a project with OPEN GRAIN — creative production studio in Mallorca. Photography, film and social content.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="assets/ux/og-ux-fixes.css">
</head>
<body>

<div class="pulse-bg" aria-hidden="true"></div>

<main class="site-shell inner-page pulse-page" id="site-shell">

  <a class="wordmark" href="/">OPEN GRAIN<span>®</span></a>
  <!-- Barra de navegación inferior. Enlaces reales de respaldo: si
       og-tabbar.js no llega a ejecutarse, la web se sigue pudiendo navegar.
       El componente los sustituye por iconos al montarse. -->
  <nav class="dock" id="dock" aria-label="Primary">
    <a href="/">Home</a>
    <a href="/work">Work</a>
    <a href="/services">Services</a>
    <a href="/about">Studio</a>
    <a href="/contact">Contact</a>
  </nav>

  <section id="contact" class="contact section-pad" data-reveal>
    <!-- Titular y subtítulo apilados: el subtítulo refleja el servicio
         elegido, de modo que quien llega desde Servicios ve confirmado qué
         ha seleccionado antes de escribir nada. -->
    <div class="contact-head">
      <h1 id="contact-heading"></h1>
      <p id="contact-lede"></p>
    </div>

    <div class="contact-card">
      <form class="project-form" id="contact-form" novalidate>
        <label id="label-name">Name<input type="text" id="name" name="name" required></label>
        <label>Email<input type="email" id="email" name="email" required placeholder="you@example.com"></label>
        <label id="label-phone">Phone<input type="tel" id="phone" name="phone" placeholder="+34"></label>
        <label id="label-service">Service<select id="service" name="service"></select>
          <span class="og-service-notice" id="service-notice" role="status" hidden></span></label>
        <label id="label-date">Preferred date<input type="date" id="date" name="date"></label>
        <label id="label-budget">Approx. budget<select id="budget" name="budget"></select></label>
        <label class="full" id="label-message">Tell us about your idea<textarea id="message" name="message"></textarea></label>
        <label class="full consent-label">
          <input type="checkbox" id="consent" name="consent" required style="width:auto;flex:0 0 auto;">
          <span id="label-consent"></span>
        </label>
        <button class="submit-btn" type="submit" id="submit-btn"></button>
      </form>
      <div class="form-success" id="form-success" hidden></div>

      <!-- Tarjeta de cristal ahumado del servicio seleccionado. La rellena
           main.js a partir del mismo catálogo que el desplegable, así que no
           puede desincronizarse de lo que se va a enviar. -->
      <aside class="service-card" id="service-card">
        <img id="service-card-img" src="assets/portfolio/portrait-studio.jpg" alt="">
        <span class="service-card-chip" id="service-card-chip">SELECTED SERVICE</span>
        <div class="service-card-body">
          <p class="service-card-index" id="service-card-index"></p>
          <h2 class="service-card-title" id="service-card-title"></h2>
          <p class="service-card-desc" id="service-card-desc"></p>
          <div class="service-card-rule" aria-hidden="true"></div>
          <p class="service-card-label" id="service-card-label"></p>
          <p class="service-card-price" id="service-card-price"></p>
          <p class="service-card-note" id="service-card-note"></p>
        </div>
      </aside>
    </div>

    <!-- Los tres bloques de contacto siguen aquí debajo, con sus enlaces
         reales. En móvil se apilan, no se ocultan. -->
    <h2 class="og-sr-only" id="contact-more-title">Other ways to reach us</h2>
    <div class="contact-details">
      <div>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        <h3>Call &amp; WhatsApp</h3>
        <p>
          <a href="tel:+34677247113">+34 677 24 71 13</a>
          <a href="https://wa.me/34677247113" target="_blank" rel="noopener">WhatsApp</a>
        </p>
      </div>
      <div>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"/></svg>
        <h3>Instagram</h3><p><a href="https://instagram.com/opengrain.studio" target="_blank" rel="noopener">@opengrain.studio</a></p>
      </div>
      <div>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="m22 6-10 7L2 6"/></svg>
        <h3>Email</h3><p><a href="mailto:adamabalde1998@gmail.com">adamabalde1998@gmail.com</a></p>
      </div>
    </div>
  </section>


  <footer class="site-footer" data-reveal>
    <div class="footer-brand">OPEN GRAIN</div>
    <div>
      <a href="https://instagram.com/opengrain.studio" target="_blank" rel="noopener">Instagram</a>
      <a href="https://tiktok.com/@opengrain.studio" target="_blank" rel="noopener">TikTok</a>
      <a href="mailto:adamabalde1998@gmail.com">Email</a>
    </div>
    <p id="footer-based"></p>
    <span>© <span id="year"></span> OPEN GRAIN · <a href="/aviso-legal" lang="es">Aviso legal</a> · <a href="/privacidad" lang="es">Privacidad</a> · <a href="/cookies" lang="es">Cookies</a></span>
  </footer>

</main>

<!-- Sin vista ampliada: esta página no tiene piezas del portfolio. -->

<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script defer src="assets/config.js"></script>
<script defer src="assets/default-copy.js"></script>
<script defer src="assets/ux/og-tabbar.js"></script>
<script defer src="assets/ux/og-contact.js"></script>
<script defer src="main.js"></script>
<script defer src="assets/motion.js"></script>
</body>
</html>
