  <section id="contact" class="contact section-pad" data-reveal>
    <div class="contact-head">
      <div><span>PLAN A PROJECT</span><h1 id="contact-heading"></h1></div>
      <p id="contact-lede"></p>
    </div>
    <div class="contact-card">
      <form class="project-form" id="contact-form" novalidate>
        <label id="label-name">Name<input type="text" id="name" name="name" required></label>
        <label>Email<input type="email" id="email" name="email" required placeholder="you@example.com"></label>
        <label id="label-phone">Phone<input type="tel" id="phone" name="phone" placeholder="+34"></label>
        <label id="label-service">Service<select id="service" name="service"></select>
          <span class="og-service-notice" id="service-notice" role="status" hidden></span></label>
        <label id="label-date">Preferred date<input type="date" id="date" name="date"></label>
        <label id="label-budget">Approx. budget<select id="budget" name="budget"></select></label>
        <label class="full" id="label-message">Tell us about your idea<textarea id="message" name="message"></textarea></label>
        <label class="full consent-label">
          <input type="checkbox" id="consent" name="consent" required style="width:auto;flex:0 0 auto;">
          <span id="label-consent"></span>
        </label>
        <button class="submit-btn" type="submit" id="submit-btn"></button>
      </form>
      <div class="form-success" id="form-success" hidden></div>
      <aside>
        <img src="assets/portfolio/editorial-interior.jpg" alt="Mallorca creative production">
        <span>YOUR PROJECT / OPEN GRAIN</span>
      </aside>
    </div>
    <div class="contact-details">
      <div>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        <h3>Call &amp; WhatsApp</h3><p><a href="https://wa.me/34677247113" target="_blank" rel="noopener">+34 677 24 71 13</a></p>
      </div>
      <div>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z"/><path d="M12 8v8M8 12h8"/></svg>
        <h3>Instagram</h3><p>@opengrain.studio</p>
      </div>
      <div>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="m22 6-10 7L2 6"/></svg>
        <h3>Email</h3><p><a href="mailto:adamabalde1998@gmail.com">adamabalde1998@gmail.com</a></p>
      </div>
    </div>
  </section>
